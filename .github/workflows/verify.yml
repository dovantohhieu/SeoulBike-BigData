name: Verify Seoul Bike notebook

on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      SPARK_LOCAL_IP: "127.0.0.1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-demo.txt
            requirements-notebook.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the tested environment
        run: python -m pip install -r requirements-notebook.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Execute notebook from source including training and 18 benchmark workers
        run: python scripts/execute_notebook.py --output runs/ci/Demo_BigData.ipynb
